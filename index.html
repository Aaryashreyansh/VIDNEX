<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><meta name="description" content="VIDNEX is your sleek workspace for authorized video previews and direct media downloads."><title>VIDNEX</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="top"><a class="brand" href="/"><span class="mark">V</span><span>VIDNEX</span><span class="brand-tag">VIDEO UNIVERSE</span></a><button id="install" class="ghost" hidden>Install app ↗</button></header>
<main>
<section class="hero"><h1><span class="gradient-text">VIDNEX</span></h1>

<div id="workspace" class="panel"><div class="panel-top"><h2>Video downloader</h2></div>
<label for="url">VIDEO URL</label><div class="inputrow"><input id="url" type="url" placeholder="Paste video link here…" autocomplete="url"><button id="check"><span>Continue</span><b>↗</b></button></div>
<div id="status" class="status" aria-live="polite"><span class="status-dot"></span><span>Ready</span></div>
<div class="previewbox"><div class="previewhead"><span>PREVIEW</span><span id="previewtype"></span></div><video id="preview" controls playsinline hidden></video><iframe id="igpreview" title="Official video preview" hidden loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="previewhint" class="previewhint"><strong>Preview</strong></div></div>
<a id="download" class="download" hidden>↓ <span>Download</span></a>
</div>
</section>
</main><footer><a class="brand" href="/"><span class="mark">V</span><span>VIDNEX</span></a></footer>
<script>
const API='https://vidnex-download-api.onrender.com';
const input=document.querySelector('#url'),check=document.querySelector('#check'),status=document.querySelector('#status'),download=document.querySelector('#download'),preview=document.querySelector('#preview'),previewhint=document.querySelector('#previewhint'),igpreview=document.querySelector('#igpreview'),previewtype=document.querySelector('#previewtype');
function setStatus(message,kind='info'){status.className='status '+kind;status.innerHTML='<span class="status-dot"></span><span></span>';status.querySelector('span:last-child').textContent=message}
function resetPreview(){download.hidden=true;download.removeAttribute('href');preview.hidden=true;preview.removeAttribute('src');preview.load();igpreview.hidden=true;igpreview.removeAttribute('src');previewhint.hidden=false;previewtype.textContent='AWAITING LINK'}
async function validate(){
 const raw=input.value.trim();resetPreview();
 if(!raw){setStatus('Paste a video link first.','error');return}
 let u;try{u=new URL(raw)}catch{setStatus('That link does not look valid. Check it and try again.','error');return}
 if(!['http:','https:'].includes(u.protocol)){setStatus('Only public HTTP or HTTPS links are supported.','error');return}
 const host=u.hostname.toLowerCase().replace(/^www\./,'');const parts=u.pathname.split('/').filter(Boolean);
 const yt=(host==='youtu.be'?parts[0]:(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com')?(u.searchParams.get('v')||((parts[0]==='shorts'||parts[0]==='embed'||parts[0]==='live')?parts[1]:null)):null);
 if(yt&&/^[A-Za-z0-9_-]{11}$/.test(yt)){download.hidden=true;download.removeAttribute('href');igpreview.src='https://www.youtube-nocookie.com/embed/'+yt;igpreview.hidden=false;previewhint.hidden=true;previewtype.textContent='YOUTUBE PLAYER';setStatus('YouTube preview ready.','success');return}
 if(host==='instagram.com'&&parts[0]==='reel'&&parts[1]){download.hidden=true;download.removeAttribute('href');igpreview.src='https://www.instagram.com/reel/'+parts[1]+'/embed/';igpreview.hidden=false;previewhint.hidden=true;previewtype.textContent='INSTAGRAM REEL';setStatus('Instagram preview ready.','success');return}
 if(host==='instagram.com'&&(parts[0]==='p'||parts[0]==='tv')&&parts[1]){download.hidden=true;download.removeAttribute('href');igpreview.src='https://www.instagram.com/'+parts[0]+'/'+parts[1]+'/embed/';igpreview.hidden=false;previewhint.hidden=true;previewtype.textContent='INSTAGRAM POST';setStatus('Instagram preview ready.','success');return}
 check.disabled=true;check.classList.add('loading');check.querySelector('span').textContent='Checking…';setStatus('Checking link…');
 try{const response=await fetch(API+'/api/inspect?url='+encodeURIComponent(u.href));const data=await response.json();if(!response.ok)throw new Error(data.error||'This link is not a supported direct media file.');preview.src=u.href;preview.hidden=false;previewhint.hidden=true;previewtype.textContent='DIRECT MEDIA';preview.onerror=()=>{previewhint.hidden=false;previewhint.querySelector('strong').textContent='Preview blocked by source';previewhint.querySelector('span').textContent='You can still try the authorized download.'};download.href=API+'/api/download?url='+encodeURIComponent(u.href);download.hidden=false;setStatus('Video ready · '+data.type,'success')}catch(e){setStatus(e.message+' Try a public MP4 or WebM file URL.','error')}finally{check.disabled=false;check.classList.remove('loading');check.querySelector('span').textContent='Analyze link'}
}
check.addEventListener('click',validate);input.addEventListener('keydown',e=>{if(e.key==='Enter')validate()});
let deferred;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;install.hidden=true});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
